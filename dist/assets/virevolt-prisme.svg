<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Logo Prisme de Virevolt</title>
  <desc id="desc">Emblème fictif composé d’un prisme, d’une étoile et d’un puck.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d42"/>
      <stop offset="0.55" stop-color="#162d5a"/>
      <stop offset="1" stop-color="#07152d"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62f2e1"/>
      <stop offset="0.48" stop-color="#4db7ff"/>
      <stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="112" fill="url(#bg)" stroke="#8cecff" stroke-width="5"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#6b75ff" stroke-width="2" stroke-dasharray="3 11" opacity=".75"/>
  <path d="M120 34 151 104 120 92 89 104Z" fill="url(#prism)" filter="url(#glow)"/>
  <path d="m120 61 8 31-8 28-8-28Z" fill="#d8ffff" opacity=".9"/>
  <path d="M74 133c19 10 73 10 92 0" fill="none" stroke="#4de5e1" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <path d="M87 147c17 13 49 13 66 0" fill="none" stroke="#a46bff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="120" cy="169" rx="31" ry="10" fill="#07111f" stroke="#d4fbff" stroke-width="3"/>
  <path d="M97 168h46M104 172h32" stroke="#7debf0" stroke-width="2" opacity=".7"/>
  <path d="m120 24 4 9 9 4-9 4-4 9-4-9-9-4 9-4Z" fill="url(#star)"/>
</svg>
